name: Security
on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false
      - name: Install pinned scanner
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - name: Scan reachable history
        run: gitleaks git . --log-opts=--all --redact --no-banner
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: Swatinem/rust-cache@v2
      - name: Install pinned advisory checker
        run: cargo install --locked cargo-deny --version 0.19.9
      - name: Check all feature dependencies
        run: cargo deny --all-features --locked check advisories
